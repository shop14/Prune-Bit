<html lang="en" data-bs-theme="light"><meta charset="utf-8"><meta name="description" content="PruneBit - Secure multi-coin wallet supporting Bitcoin, Ethereum, Litecoin, Dogecoin and more."><meta name="viewport" content="width=device-width,initial-scale=1"><title>Address Check - PruneBit</title><link rel="stylesheet" href="../css/bitcoin-style.css?v=20260816h"><link rel="stylesheet" href="../css/glass.css?v=20260816h"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"><style>
.check-input-group{display:flex;align-items:stretch;border-radius:.75rem;border:2px solid var(--bs-border-color);transition:border-color .2s;position:relative}
.check-input-group input{border-radius:.75rem 0 0 .75rem;flex:1;border:none;outline:0;padding:.85rem 1rem;font-size:.95rem;background:0 0;color:var(--bs-body-color);min-width:0}
.check-input-group input::placeholder{color:var(--bs-secondary-color);opacity:.7}
.check-input-group:focus-within{border-color:var(--bs-primary)}
.coin-dropdown{display:flex;border-left:2px solid var(--bs-border-color);background:var(--bs-tertiary-bg);min-width:100px;cursor:pointer;user-select:none;border-radius:0 .75rem .75rem 0;position:relative;flex-shrink:0}
.coin-dropdown-toggle{display:flex;align-items:center;gap:6px;padding:.5rem .75rem;border:none;background:0 0;color:var(--bs-body-color);font-size:.85rem;font-weight:600;cursor:pointer;outline:0;width:100%;height:100%;position:relative;z-index:2}
.coin-dropdown-toggle .coin-icon{width:18px;height:18px;border-radius:50%;object-fit:cover;flex-shrink:0}
.coin-dropdown-toggle .coin-icon-fallback{font-size:1.1rem;line-height:1}
.coin-dropdown-toggle .chevron{font-size:.7rem;margin-left:auto;color:var(--bs-secondary-color);transition:transform .2s;pointer-events:none}
.coin-dropdown.open .chevron{transform:rotate(180deg)}
.coin-dropdown-menu{position:absolute;top:calc(100% + 6px);left:0;right:0;z-index:1000;background:var(--bs-body-bg);border:2px solid var(--bs-border-color);border-radius:.75rem;padding:4px;max-height:280px;overflow-y:auto;display:none;box-shadow:0 8px 24px rgba(0,0,0,0.12)}
.coin-dropdown.open .coin-dropdown-menu{display:block}
.coin-option{display:flex;align-items:center;gap:8px;padding:.5rem .65rem;border-radius:.5rem;cursor:pointer;font-size:.82rem;font-weight:500;color:var(--bs-body-color);transition:background .15s}
.coin-option:hover{background:var(--bs-tertiary-bg)}
.coin-option.selected{background:rgba(255,126,0,0.1);color:var(--btc-orange);font-weight:700}
.coin-option .coin-opt-img{width:16px;height:16px;border-radius:50%;object-fit:cover;flex-shrink:0}

.result-card{border:2px solid var(--bs-border-color);border-radius:1rem;padding:1.5rem;background:var(--bs-body-bg);display:none}
.result-card.visible{display:block;animation:fadeIn .3s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.balance-display{font-size:2rem;font-weight:800;line-height:1.2}
.usd-display{font-size:1.1rem;color:var(--bs-secondary-color);margin-top:.25rem}
.date-display{font-size:.8rem;color:var(--bs-secondary-color);margin-top:.5rem}
.explorer-link{display:inline-flex;align-items:center;gap:.5rem;margin-top:1rem;padding:.5rem 1rem;background:var(--bs-tertiary-bg);border-radius:.5rem;color:var(--bs-primary);text-decoration:none;font-weight:600;font-size:.85rem;transition:background .2s}
.explorer-link:hover{background:var(--bs-secondary-bg);color:var(--bs-primary)}
.error-msg{color:#dc3545;font-size:.85rem;margin-top:.5rem;display:none}
.error-msg.visible{display:block}
.spinner-sm{width:1rem;height:1rem;border-width:2px}

</style>

<script>
var coinValidators = {
  BTC: function(t) { return /^(1[a-km-zA-HJ-NP-Z1-9]{25,34}|3[a-km-zA-HJ-NP-Z1-9]{25,34}|bc1[a-zA-HJ-NP-Z0-9]{25,90}|BC1[A-Z0-9]{25,90})$/.test(t); },
  BTCT: function(t) { return /^(m[a-km-zA-HJ-NP-Z1-9]{25,34}|n[a-km-zA-HJ-NP-Z1-9]{25,34}|tb1[a-zA-HJ-NP-Z0-9]{25,90})$/.test(t); },
  LTC: function(t) { return /^(L[a-km-zA-HJ-NP-Z1-9]{26,33}|M[a-km-zA-HJ-NP-Z1-9]{26,33}|ltc1[a-zA-HJ-NP-Z0-9]{25,90})$/.test(t); },
  ETH: function(t) { return /^0x[a-fA-F0-9]{40}$/.test(t); },
  ETC: function(t) { return /^0x[a-fA-F0-9]{40}$/.test(t); },
  USDT: function(t) { return /^0x[a-fA-F0-9]{40}$/.test(t); },
  POLYGON: function(t) { return /^0x[a-fA-F0-9]{40}$/.test(t); },
  BSC: function(t) { return /^0x[a-fA-F0-9]{40}$/.test(t); },
  DOGE: function(t) { return /^D[a-km-zA-HJ-NP-Z1-9]{25,34}$/.test(t); },
  DASH: function(t) { return /^X[a-km-zA-HJ-NP-Z1-9]{25,34}$/.test(t); },
  DGB: function(t) { return /^(D[a-km-zA-HJ-NP-Z1-9]{25,34}|dgb1[a-zA-HJ-NP-Z0-9]{25,90})$/.test(t); },
  RVN: function(t) { return /^R[a-km-zA-HJ-NP-Z1-9]{25,34}$/.test(t); },
  BTG: function(t) { return /^[GA][a-km-zA-HJ-NP-Z1-9]{25,34}$/.test(t); },
  ZEC: function(t) { return /^(t[a-km-zA-HJ-NP-Z1-9]{25,34}|zs[a-zA-Z0-9]{76})$/.test(t); },
  BSV: function(t) { return /^(1[a-km-zA-HJ-NP-Z1-9]{25,34}|[qp][a-zA-HJ-NP-Z0-9]{41})$/.test(t); },
  XVG: function(t) { return /^D[a-km-zA-HJ-NP-Z1-9]{25,34}$/.test(t); },
  QTUM: function(t) { return /^Q[a-km-zA-HJ-NP-Z1-9]{25,34}$/.test(t); },
  VTC: function(t) { return /^V[a-km-zA-HJ-NP-Z1-9]{25,34}$/.test(t); },
  KMD: function(t) { return /^R[a-km-zA-HJ-NP-Z1-9]{25,34}$/.test(t); },
  KASPA: function(t) { return /^kaspa:[a-z0-9]{59,64}$/.test(t); },
  XRP: function(t) { return /^r[a-zA-Z0-9]{24,34}$/.test(t); }
};

var coinHints = {
  BTC: "BTC addresses start with 1, 3, or bc1",
  BTCT: "Testnet addresses start with m, n, or tb1",
  LTC: "LTC addresses start with L, M, or ltc1",
  ETH: "ETH addresses start with 0x (42 characters)",
  ETC: "ETC addresses start with 0x (42 characters)",
  USDT: "USDT (ERC-20) addresses start with 0x",
  POLYGON: "MATIC addresses start with 0x",
  BSC: "BNB addresses start with 0x",
  DOGE: "DOGE addresses start with D",
  DASH: "DASH addresses start with X",
  DGB: "DGB addresses start with D or dgb1",
  RVN: "RVN addresses start with R",
  BTG: "BTG addresses start with G or A",
  ZEC: "ZEC addresses start with t or zs",
  BSV: "BSV addresses start with 1 or q/p",
  XVG: "XVG addresses start with D",
  QTUM: "QTUM addresses start with Q",
  VTC: "VTC addresses start with V",
  KMD: "KMD addresses start with R",
  KASPA: "KASPA addresses start with kaspa:",
  XRP: "XRP addresses start with r"
};

function clearResults() {
  document.getElementById('errorMsg').classList.remove('visible');
  document.getElementById('resultCard').classList.remove('visible');
}

function showError(msg) {
  var el = document.getElementById('errorMsg');
  el.textContent = msg;
  el.classList.add('visible');
}

async function checkAddress() {
  var coin = document.getElementById('coinSelector').value;
  var address = document.getElementById('addressInput').value.trim();
  var btn = document.getElementById('checkBtn');

  clearResults();

  if (!address) {
    showError('Please enter an address.');
    return;
  }

  if (coinValidators[coin] && !coinValidators[coin](address)) {
    showError(coinHints[coin] || 'Invalid address format for ' + coin);
    return;
  }

  btn.disabled = true;
  btn.innerHTML = '<span class="spinner-border spinner-border-sm spinner-sm me-1"></span> Checking...';

  try {
    var resp = await fetch('/api/address_check', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        address: address,
        coin: coin
      })
    });
    var data = await resp.json();

    if (!data.success) {
      showError(data.error || 'Failed to check address.');
      return;
    }

    var resultCard = document.getElementById('resultCard');
    document.getElementById('resultCoin').textContent = data.coin + ' Balance';
    document.getElementById('resultAddress').textContent = data.address;

    var balanceText = data.balance.toFixed(8) + ' ' + data.coin;
    if (data.unconfirmed_balance && data.unconfirmed_balance !== 0) {
      var prefix = data.unconfirmed_balance > 0 ? '+' : '';
      balanceText += ' (' + prefix + data.unconfirmed_balance.toFixed(8) + ' unconfirmed)';
    }
    document.getElementById('resultBalance').textContent = balanceText;

    if (data.price_usd !== null) {
      var usd = data.balance * data.price_usd;
      document.getElementById('resultUsd').textContent = '= $' + usd.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    } else {
      document.getElementById('resultUsd').textContent = '';
    }

    var now = new Date();
    document.getElementById('resultDate').textContent = now.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) + ', ' + now.toLocaleTimeString('en-US');

    var explorer = document.getElementById('resultExplorer');
    if (data.explorer_url) {
      explorer.href = data.explorer_url;
      explorer.style.display = 'inline-flex';
    } else {
      explorer.style.display = 'none';
    }

    resultCard.classList.add('visible');
  } catch (e) {
    showError('Network error. Please try again.');
  } finally {
    btn.disabled = false;
    btn.innerHTML = '<i class="bi bi-search me-1"></i> Check';
  }
}

document.getElementById('addressInput').addEventListener('keydown', function(t) { if (t.key === 'Enter') checkAddress(); });
document.getElementById('checkBtn').addEventListener('click', checkAddress);

function _setCoin(val,label){
var imgEl=document.getElementById('coinIconImg');
var fbEl=imgEl.nextElementSibling;
imgEl.src='../img/logos/'+({BTC:'btc.png',ETH:'eth.png',LTC:'ltc.png',DOGE:'doge.png',BCH:'bch.png',DASH:'dash.png',DGB:'dgb.png',RVN:'rvn.png',BTG:'btg.png',ZEC:'zec.png',BSV:'bsv.png',XVG:'xvg.png',QTUM:'qtum.png',VTC:'vtc.png',KMD:'kmd.png',ETC:'etc.png',KASPA:'kas.png',XRP:'xrp.png',USDT:'usdt.png',POLYGON:'matic.png',BSC:'bnb.png'})[val];
imgEl.style.display='';
fbEl.style.display='none';
document.getElementById('coinDropdownText').textContent=label;
document.getElementById('coinSelector').value=val;
}

(function(){
var coinIcons={BTC:'btc.png',ETH:'eth.png',LTC:'ltc.png',DOGE:'doge.png',BCH:'bch.png',DASH:'dash.png',DGB:'dgb.png',RVN:'rvn.png',BTG:'btg.png',ZEC:'zec.png',BSV:'bsv.png',XVG:'xvg.png',QTUM:'qtum.png',VTC:'vtc.png',KMD:'kmd.png',ETC:'etc.png',KASPA:'kas.png',XRP:'xrp.png',USDT:'usdt.png',POLYGON:'matic.png',BSC:'bnb.png'};
var coinIconsFallback={BTC:'bi-currency-bitcoin',ETH:'bi-currency-ethereum',LTC:'bi-coin',DOGE:'bi-coin',BCH:'bi-coin',DASH:'bi-coin',DGB:'bi-coin',RVN:'bi-coin',BTG:'bi-coin',ZEC:'bi-coin',BSV:'bi-coin',XVG:'bi-coin',QTUM:'bi-coin',VTC:'bi-coin',KMD:'bi-coin',ETC:'bi-coin',KASPA:'bi-coin',XRP:'bi-coin',USDT:'bi-coin',POLYGON:'bi-coin',BSC:'bi-coin'};
var coins=[{v:'BTC',l:'BTC'},{v:'ETH',l:'ETH'},{v:'LTC',l:'LTC'},{v:'DOGE',l:'DOGE'},{v:'BCH',l:'BCH'},{v:'DASH',l:'DASH'},{v:'DGB',l:'DGB'},{v:'RVN',l:'RVN'},{v:'BTG',l:'BTG'},{v:'ZEC',l:'ZEC'},{v:'BSV',l:'BSV'},{v:'XVG',l:'XVG'},{v:'QTUM',l:'QTUM'},{v:'VTC',l:'VTC'},{v:'KMD',l:'KMD'},{v:'ETC',l:'ETC'},{v:'KASPA',l:'KAS'},{v:'XRP',l:'XRP'},{v:'USDT',l:'USDT'},{v:'POLYGON',l:'MATIC'},{v:'BSC',l:'BNB'}];
var menu=document.getElementById('coinDropdownMenu');
var btn=document.getElementById('coinDropdownBtn');
var textEl=document.getElementById('coinDropdownText');
var hiddenSelect=document.getElementById('coinSelector');

coins.forEach(function(c){
var opt=document.createElement('div');
opt.className='coin-option'+(c.v==='BTC'?' selected':'');
opt.dataset.value=c.v;
var img=document.createElement('img');
img.className='coin-opt-img';
img.src='../img/logos/'+coinIcons[c.v];
img.alt=c.l;
img.addEventListener('error',function(){this.style.display='none';this.nextElementSibling.style.display='inline'});
opt.appendChild(img);
var fb=document.createElement('i');
fb.className='coin-opt-icon bi '+coinIconsFallback[c.v];
opt.appendChild(fb);
var sp=document.createElement('span');
sp.textContent=c.l;
opt.appendChild(sp);
opt.dataset.label=c.l;
opt.addEventListener('click',function(e){
e.stopPropagation();
document.querySelectorAll('.coin-option').forEach(function(o){o.classList.remove('selected')});
this.classList.add('selected');
_setCoin(this.dataset.value,this.dataset.label);
document.getElementById('coinDropdown').classList.remove('open');
});
menu.appendChild(opt);
});

btn.addEventListener('click',function(e){
e.stopPropagation();
document.getElementById('coinDropdown').classList.toggle('open');
});

document.addEventListener('click',function(){document.getElementById('coinDropdown').classList.remove('open')});
})();

document.getElementById('coinIconImg').addEventListener('error',function(){this.style.display='none';this.nextElementSibling.style.display='inline'});

</script>
</div>
</body>
</html>

<body class="bitcoin-style"><div class="page-glow" aria-hidden="true"></div><style>.page-card{width:80%;max-width:900px;margin:0 auto}.code-panel{background:#F1EEE7;border:1px dashed #E5E0D5;border-radius:10px;padding:10px 12px;margin-bottom:12px;position:relative;overflow:hidden}.code-chars{display:flex;align-items:center;justify-content:center;gap:4px;margin-bottom:8px;user-select:none;-webkit-user-select:none}.code-char{display:inline-flex;align-items:center;justify-content:center;width:28px;height:34px;font-size:1.05rem;font-weight:800;border-radius:6px;color:#212529;text-shadow:1px 1px 2px rgba(0,0,0,0.1);font-family:'Courier New',monospace}.code-refresh{position:absolute;top:6px;right:6px;background:none;border:1px solid #E5E0D5;border-radius:5px;width:22px;height:22px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#6c757d;font-size:0.7rem;transition:all 0.15s}.code-refresh:hover{border-color:#ff7e00;color:#ff7e00}.code-refresh.spinning i{animation:spin .6s linear}@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}.code-label{font-size:0.7rem;font-weight:600;color:#6c757d;text-align:center;margin-bottom:6px}.code-input{width:100%;padding:7px 10px;border:1px solid #E5E0D5;border-radius:8px;font-size:0.85rem;font-weight:600;text-align:center;letter-spacing:3px;background:#FBFAF7;color:#212529;font-family:'Courier New',monospace;transition:border-color 0.15s;box-sizing:border-box}.code-input:focus{outline:0;border-color:#ff7e00;box-shadow:0 0 0 3px rgba(255,126,0,0.12)}.code-input.is-valid{border-color:#ff7e00}.code-input.is-invalid{border-color:#dc3545}.code-line{position:absolute;width:120%;height:1.5px;left:-10%;opacity:0.15;pointer-events:none}.code-loading{text-align:center;padding:8px 0;font-size:0.75rem;color:#6c757d}@media(max-width:576px){.page-card{width:90%}}</style><style>

</style><div class="page-content"><div class="page-card"><div class="page-card-header"><div><h1 class="fs-4 fw-bold" data-i18n="Contact Support">Contact Support</h1><p class="text-muted small mb-0" data-i18n="Create a support ticket and our admin team will review it.">Create a support ticket and our admin team will review it.</div></div><div class="page-card-body"><div class="alert alert-info mb-4" data-i18n="Do not include your seed phrase, private key, or PIN in this form."><i class="bi bi-info-circle me-2"></i> Do not include your seed phrase, private key, or PIN in this form.</div><form id="ticketForm" class="needs-validation" novalidate><div class="row g-4"><div class="col-md-6"><label for="ticketName" class="form-label" data-i18n="Full Name">Full Name</label> <input class="form-control" id="ticketName" required maxlength="120"></div><div class="col-md-6"><label for="ticketEmail" class="form-label" data-i18n="Email Address">Email Address</label> <input type="email" class="form-control" id="ticketEmail" required maxlength="180"></div><div class="col-md-6"><label for="ticketWalletId" class="form-label" data-i18n="Wallet ID (optional)">Wallet ID <span class="text-muted">(optional)</span></label> <input class="form-control" id="ticketWalletId" maxlength="160" placeholder="Wallet ID if available" data-i18n="Wallet ID if available"></div><div class="col-md-6"><label for="ticketCategory" class="form-label" data-i18n="Category">Category</label> <select class="form-select" id="ticketCategory" required><option value="" data-i18n="Select a category">Select a category<option value="Wallet Access" data-i18n="Wallet Access">Wallet Access<option value="Transaction" data-i18n="Transaction">Transaction<option value="Receive" data-i18n="Receive">Receive<option value="Send" data-i18n="Send">Send<option value="Security" data-i18n="Security">Security<option value="Bug Report" data-i18n="Bug Report">Bug Report<option value="Other" data-i18n="Other">Other</select></div><div class="col-md-6"><label for="ticketPriority" class="form-label" data-i18n="Priority">Priority</label> <select class="form-select" id="ticketPriority" required><option value="Normal" data-i18n="Normal">Normal<option value="High" data-i18n="High">High<option value="Urgent" data-i18n="Urgent">Urgent</select></div><div class="col-md-6"><label for="ticketSubject" class="form-label" data-i18n="Subject">Subject</label> <input class="form-control" id="ticketSubject" required maxlength="180"></div><div class="col-12"><label for="ticketMessage" class="form-label" data-i18n="Message">Message</label> <textarea class="form-control" id="ticketMessage" rows="7" required maxlength="4000" placeholder="Describe the issue and include any non-secret details that can help support." data-i18n="Describe the issue and include any non-secret details that can help support."></textarea></div><div class="code-panel" id="codePanel"><button type="button" class="code-refresh" id="codeRefresh" title="New code"><i class="bi bi-arrow-clockwise"></i></button><div id="codeView"><div class="code-loading"><div class="spinner-border spinner-border-sm"></div></div></div><div class="code-label" data-i18n="Type the characters above">Type the characters above</div><input type="text" id="codeInput" class="code-input" placeholder="Enter code" autocomplete="off" maxlength="6" inputmode="text" required disabled></div><div class="col-12"><button type="submit" class="btn btn-primary" id="submitTicketBtn" data-i18n="Submit Ticket"><i class="bi bi-send me-2"></i>Submit Ticket</button> <button type="reset" class="btn btn-outline-secondary ms-2" data-i18n="Clear">Clear</button></div></div></form><div id="ticketResult" class="mt-4"></div></div></div></div><script src="/js/lib/bootstrap.bundle.min.js"></script><script>const form=document.getElementById("ticketForm"),result=document.getElementById("ticketResult"),submitBtn=document.getElementById("submitTicketBtn"),trimText=(e,t)=>String(e||"").trim().slice(0,t),isValidEmail=e=>/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e);form.addEventListener("submit",async e=>{if(e.preventDefault(),!form.checkValidity())return void form.classList.add("was-validated");const t={name:trimText(document.getElementById("ticketName").value,120),email:trimText(document.getElementById("ticketEmail").value,180),wallet_id:trimText(document.getElementById("ticketWalletId").value,160),category:trimText(document.getElementById("ticketCategory").value,60),priority:trimText(document.getElementById("ticketPriority").value,40),subject:trimText(document.getElementById("ticketSubject").value,180),message:trimText(document.getElementById("ticketMessage").value,4e3),user_agent:navigator.userAgent};if(isValidEmail(t.email)){submitBtn.disabled=!0,submitBtn.innerHTML='<span class="spinner-border spinner-border-sm me-2"></span>Submitting...';try{const e=await fetch("/api/support_tickets",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(Object.assign(t,{captcha_token:_captchaToken,captcha_code:document.getElementById("codeInput").value}))}),i=await e.json();i.success?(result.innerHTML='<div class="alert alert-success">Ticket submitted successfully. Our admin team will review it shortly.</div>',form.reset(),form.classList.remove("was-validated")):result.innerHTML=`<div class="alert alert-info">${escapeHtml(i.error||"Failed to submit ticket.")}</div>`}catch(e){result.innerHTML=`<div class="alert alert-info">Error: ${escapeHtml(e.message)}</div>`}finally{submitBtn.disabled=!1,submitBtn.innerHTML='<i class="bi bi-send me-2"></i>Submit Ticket'}}else result.innerHTML='<div class="alert alert-info">Enter a valid email address.</div>'})</script>
<script>var _captchaToken=null;
async function generateCaptcha(){var btn=document.getElementById('codeRefresh'),display=document.getElementById('codeView'),input=document.getElementById('codeInput');btn.classList.add('spinning');display.innerHTML='<div class="code-loading"><div class="spinner-border spinner-border-sm"></div></div>';input.disabled=true;input.value='';input.classList.remove('is-valid','is-invalid');try{var resp=await fetch('/api/captcha/generate',{method:'POST',headers:{'Content-Type':'application/json'}});var data=await resp.json();if(data.success){_captchaToken=data.captcha_token;display.innerHTML=atob(data.captcha_image);input.disabled=false;}else{display.innerHTML='<div class="code-loading" style="color:#dc3545;">Failed to load captcha</div>'}}catch(e){display.innerHTML='<div class="code-loading" style="color:#dc3545;">Network error</div>'}btn.classList.remove('spinning')}
document.getElementById('codeInput').addEventListener('input',function(){var val=this.value.toUpperCase().replace(/[^A-Z0-9]/g,'');this.value=val;if(val.length>=6){this.classList.remove('is-invalid');this.classList.add('is-valid')}else{this.classList.remove('is-valid','is-invalid')}});
document.getElementById('codeRefresh').addEventListener('click',function(){generateCaptcha()});
generateCaptcha();</script>

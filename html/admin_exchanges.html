<!doctype html>
<html lang="en" data-bs-theme="light">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/svg+xml" href="../img/logo.svg">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Exchanges - PruneBit</title>
<link rel="stylesheet" href="../css/admin.css?v=20260816h"><link rel="stylesheet" href="../css/glass.css?v=20260816h">
<script src="../js/security.js"></script>
</head>
<body class="bitcoin-style admin-page font-inter">
<div class="admin-main">
<div class="admin-page-header">
  <h2><i class="bi bi-arrow-left-right me-2"></i>Exchanges</h2>
  <div style="display:flex;align-items:center;gap:8px;">
    <button class="btn btn-sm btn-outline-danger" id="deleteSelectedBtn" disabled><i class="bi bi-trash me-1"></i>Delete Selected</button>
    <button class="btn btn-sm btn-danger" id="deleteAllBtn"><i class="bi bi-trash me-1"></i>Delete All</button>
    <button class="btn btn-sm btn-primary" id="refreshBtn"><i class="bi bi-arrow-clockwise me-1"></i>Refresh</button>
  </div>
</div>
<div class="card admin-card">
  <div class="card-body p-0">
    <div class="table-responsive">
      <table class="table admin-table align-middle mb-0">
        <thead>
          <tr>
            <th style="width:40px;"><input type="checkbox" id="selectAllCb"></th>
            <th>Exchange ID</th><th>User</th><th>From</th><th>To</th><th>Amount</th><th>Status</th><th>Date</th><th>Actions</th>
          </tr>
        </thead>
        <tbody id="exchangesTableBody"></tbody>
      </table>
    </div>
  </div>
</div>
<div class="d-flex align-items-center justify-content-between mt-3" id="paginationWrap" style="display:none !important;">
  <span class="text-secondary small" id="pageInfo"></span>
  <div class="d-flex gap-2">
    <button class="btn btn-sm btn-outline-secondary" id="prevPageBtn" disabled>&laquo; Prev</button>
    <button class="btn btn-sm btn-outline-secondary" id="nextPageBtn" disabled>Next &raquo;</button>
  </div>
</div>
</div>
<script src="../js/admin_shared.js?v=20260725a"></script>
<script>
var _allExchanges = [];
var _currentPage = 1;
var _perPage = 10;
var _selectedIds = {};

var statusOrder = { finished: 0, new: 1, waiting: 2, confirming: 3, exchanging: 4, sending: 5, verifying: 6, failed: 7, refunded: 8, expired: 9 };

function sortExchanges(exchanges) {
  return exchanges.slice().sort(function(a, b) {
    var sa = statusOrder[a.status] != null ? statusOrder[a.status] : 9;
    var sb = statusOrder[b.status] != null ? statusOrder[b.status] : 9;
    if (sa !== sb) return sa - sb;
    var da = new Date(a.created_at || 0).getTime();
    var db = new Date(b.created_at || 0).getTime();
    return db - da;
  });
}

function getPageExchanges() {
  var start = (_currentPage - 1) * _perPage;
  return _allExchanges.slice(start, start + _perPage);
}

function totalPages() { return Math.max(1, Math.ceil(_allExchanges.length / _perPage)); }

function updatePagination() {
  var wrap = document.getElementById('paginationWrap');
  var total = _allExchanges.length;
  if (total <= _perPage) { wrap.style.display = 'none'; return; }
  wrap.style.display = 'flex';
  var tp = totalPages();
  if (_currentPage > tp) _currentPage = tp;
  document.getElementById('pageInfo').textContent = 'Page ' + _currentPage + ' of ' + tp + ' (' + total + ' exchanges)';
  document.getElementById('prevPageBtn').disabled = _currentPage <= 1;
  document.getElementById('nextPageBtn').disabled = _currentPage >= tp;
}

function updateDeleteBtn() {
  var count = Object.keys(_selectedIds).length;
  document.getElementById('deleteSelectedBtn').disabled = count === 0;
  document.getElementById('deleteSelectedBtn').innerHTML = '<i class="bi bi-trash me-1"></i>Delete Selected' + (count > 0 ? ' (' + count + ')' : '');
}

function renderTable() {
  var exchanges = getPageExchanges();
  document.getElementById('exchangesTableBody').innerHTML = exchanges.length === 0
    ? '<tr><td colspan="9" class="text-center text-muted py-4">No exchanges found</td></tr>'
    : exchanges.map(function(s) {
        var statusClass = 'finished' === s.status ? 'bg-success' : 'failed' === s.status || 'refunded' === s.status || 'expired' === s.status ? 'bg-danger' : 'bg-warning';
        var shortId = (s.exchange_id || s.id || '').substring(0, 12);
        var walletId = (s.wallet_id || '').substring(0, 12);
        var exchangeKey = escapeHtml(s.exchange_id || s.id || '');
        var checked = _selectedIds[exchangeKey] ? ' checked' : '';
        return '<tr>' +
          '<td><input type="checkbox" class="exchange-cb" data-exchange-id="' + exchangeKey + '"' + checked + '></td>' +
          '<td><code class="small">' + escapeHtml(shortId) + (shortId.length >= 12 ? '...' : '') + '</code></td>' +
          '<td><code class="small">' + escapeHtml(walletId) + (walletId.length >= 12 ? '...' : '') + '</code></td>' +
          '<td class="fw-semibold">' + escapeHtml(s.from_currency || 'N/A') + '</td>' +
          '<td class="fw-semibold">' + escapeHtml(s.to_currency || 'N/A') + '</td>' +
          '<td>' + escapeHtml(s.from_amount || '0') + ' &rarr; ' + escapeHtml(s.to_amount || '0') + '</td>' +
          '<td><span class="badge ' + statusClass + '">' + escapeHtml(s.status) + '</span></td>' +
          '<td class="text-secondary small">' + escapeHtml(s.created_at || '-') + '</td>' +
          '<td style="white-space:nowrap;">' +
            '<select class="form-select form-select-sm exchange-status-select d-inline-block" style="width:auto;" data-exchange-id="' + exchangeKey + '">' +
              '<option value="">Status...</option>' +
              '<option value="new">New</option>' +
              '<option value="waiting">Waiting</option>' +
              '<option value="confirming">Confirming</option>' +
              '<option value="exchanging">Exchanging</option>' +
              '<option value="sending">Sending</option>' +
              '<option value="finished">Finished</option>' +
              '<option value="failed">Failed</option>' +
              '<option value="refunded">Refunded</option>' +
              '<option value="verifying">Verifying</option>' +
              '<option value="expired">Expired</option>' +
            '</select> ' +
            '<button class="btn btn-sm btn-outline-danger exchange-delete-btn" data-exchange-id="' + exchangeKey + '"><i class="bi bi-trash"></i></button>' +
          '</td>' +
        '</tr>';
      }).join('');
  document.getElementById('selectAllCb').checked = exchanges.length > 0 && exchanges.every(function(s) { return _selectedIds[escapeHtml(s.exchange_id || s.id || '')]; });
  updatePagination();
  updateDeleteBtn();
}

async function loadExchanges() {
  try {
    var data = await adminPost('/api/admin/changenow/list');
    if (data.success) {
      var exchanges = data.exchanges || [];

      _allExchanges = sortExchanges(exchanges);
      _currentPage = 1;
      _selectedIds = {};
      renderTable();
    }
  } catch(e) { console.error('Error loading exchanges:', e); }
}

async function updateExchangeStatus(id, status) {
  if (!status) return;
  try {
    var data = await adminPost('/api/admin/changenow/update', { exchange_id: id, status: status });
    if (data.success) loadExchanges();
    else alert(data.error || 'Failed to update exchange status');
  } catch(e) { alert('Error: ' + e.message); }
}

async function deleteExchange(id) {
  try {
    var data = await adminPost('/api/admin/changenow/delete', { exchange_id: id });
    if (data.success) loadExchanges();
    else alert(data.error || 'Failed to delete exchange');
  } catch(e) { alert('Error: ' + e.message); }
}

async function deleteExchanges(ids) {
  var ok = 0, fail = 0;
  for (var i = 0; i < ids.length; i++) {
    try {
      var data = await adminPost('/api/admin/changenow/delete', { exchange_id: ids[i] });
      if (data.success) ok++; else fail++;
    } catch(e) { fail++; }
  }
  if (fail > 0) alert('Deleted ' + ok + ', failed ' + fail);
  loadExchanges();
}

document.addEventListener('DOMContentLoaded', function() {
  loadExchanges();

  document.getElementById('refreshBtn').addEventListener('click', loadExchanges);

  document.getElementById('prevPageBtn').addEventListener('click', function() {
    if (_currentPage > 1) { _currentPage--; renderTable(); }
  });
  document.getElementById('nextPageBtn').addEventListener('click', function() {
    if (_currentPage < totalPages()) { _currentPage++; renderTable(); }
  });

  document.getElementById('selectAllCb').addEventListener('change', function(e) {
    var exchanges = getPageExchanges();
    exchanges.forEach(function(s) {
      var key = escapeHtml(s.exchange_id || s.id || '');
      if (e.target.checked) _selectedIds[key] = true;
      else delete _selectedIds[key];
    });
    renderTable();
  });

  document.getElementById('exchangesTableBody').addEventListener('change', function(e) {
    if (e.target.classList.contains('exchange-status-select')) {
      updateExchangeStatus(e.target.getAttribute('data-exchange-id'), e.target.value);
    }
    if (e.target.classList.contains('exchange-cb')) {
      var sid = e.target.getAttribute('data-exchange-id');
      if (e.target.checked) _selectedIds[sid] = true;
      else delete _selectedIds[sid];
      updateDeleteBtn();
      document.getElementById('selectAllCb').checked = getPageExchanges().length > 0 && getPageExchanges().every(function(s) { return _selectedIds[escapeHtml(s.exchange_id || s.id || '')]; });
    }
  });

  document.getElementById('exchangesTableBody').addEventListener('click', function(e) {
    var btn = e.target.closest('.exchange-delete-btn');
    if (!btn) return;
    var sid = btn.getAttribute('data-exchange-id');
    if (!confirm('Delete this exchange?')) return;
    deleteExchange(sid);
  });

  document.getElementById('deleteSelectedBtn').addEventListener('click', function() {
    var ids = Object.keys(_selectedIds);
    if (ids.length === 0) return;
    if (!confirm('Delete ' + ids.length + ' selected exchange(s)?')) return;
    deleteExchanges(ids);
  });

  document.getElementById('deleteAllBtn').addEventListener('click', function() {
    if (_allExchanges.length === 0) return;
    if (!confirm('Delete ALL ' + _allExchanges.length + ' exchange(s)? This cannot be undone.')) return;
    var ids = _allExchanges.map(function(s) { return s.exchange_id || s.id || ''; }).filter(Boolean);
    deleteExchanges(ids);
  });
});
</script>
</body>
</html>

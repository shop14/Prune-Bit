<div class="p-4"><div class="status-content-wrap" style="max-width:61.2rem;margin-left:auto;margin-right:auto"><div id="statusContent"><div class="text-center py-8"><div class="d-flex align-items-center justify-center mx-auto mb-4" style="width:4rem;height:4rem;background:var(--bs-tertiary-bg);border-radius:50%"><span class="spinner-border" role="status"></span></div><p class="text-muted" data-i18n="Loading status...">Loading status...</div></div></div></div><style>.status-banner{text-align:center;padding:40px 24px;border-radius:12px;margin-bottom:24px;background-color:var(--cv-success-light);border:1px solid var(--cv-success);color:var(--cv-success)}.status-banner h2{font-size:1.5rem;font-weight:700;margin:0 0 4px 0;color:inherit}.status-banner p{font-size:.85rem;opacity:.85;margin:0;color:inherit}.status-banner .status-icon{display:inline-flex;align-items:center;justify-content:center;width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.5);font-size:1.4rem;margin-bottom:12px}.status-section{margin-bottom:28px}.status-section h3{font-size:1.1rem;font-weight:700;color:var(--bs-body-color);margin:0 0 4px 0}.status-section p{font-size:.85rem;color:var(--bs-secondary-color);margin:0 0 16px 0}.status-component{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--cv-border)}.status-component:last-child{border-bottom:none}.status-component .name{display:flex;align-items:center;gap:10px;font-size:.88rem;font-weight:600;color:var(--bs-body-color)}.status-component .name .dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}.status-component .name .dot.operational{background:var(--cv-success)}.status-component .name .dot.degraded{background:var(--cv-warning)}.status-component .name .dot.major{background:var(--cv-danger)}.status-component .status-value{font-size:.82rem;color:var(--bs-secondary-color);font-weight:500}.status-component .status-value.operational{color:var(--cv-success)}.status-card{background:var(--cv-surface);border:1px solid var(--cv-border);border-radius:10px;overflow:hidden}.status-card-header{padding:14px 16px;border-bottom:1px solid var(--cv-border);background:var(--bs-tertiary-bg)}.status-card-header h4{font-size:.8rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--bs-secondary-color);margin:0}.status-incident{padding:14px 16px;border-left:3px solid var(--cv-warning);background:var(--cv-warning-light);border-radius:6px;margin-bottom:10px}.status-incident h5{font-size:.88rem;font-weight:600;color:var(--bs-body-color);margin:0 0 4px 0}.status-incident p{font-size:.8rem;color:var(--bs-secondary-color);margin:0}.status-empty{text-align:center;padding:20px}.status-empty i{font-size:1.5rem;color:var(--cv-success);margin-bottom:8px}.status-empty p{font-size:.85rem;color:var(--bs-secondary-color);margin:0}.status-footer-text{text-align:center;padding:16px;font-size:.78rem;color:var(--bs-secondary-color)}.status-footer-text a{color:var(--cv-primary);text-decoration:none}.status-footer-text a:hover{text-decoration:underline}</style><script>function escapeHtml(a){const s=document.createElement("div");return s.textContent=a,s.innerHTML}async function loadStatus(){try{const a=await fetch("/api/status",{method:"GET",headers:{"Content-Type":"application/json"}}),s=await a.json(),n=document.getElementById("statusContent");if(s.success){const a="operational"===s.status,t=a?"var(--cv-success-light)":"var(--cv-warning-light)",e=a?"1px solid var(--cv-success)":"1px solid var(--cv-warning)",i=a?"var(--cv-success)":"var(--cv-warning)";n.innerHTML=`\n            <div class="status-banner" style="background:${t};border:${e};color:${i};">\n              <div class="status-icon">\n                <i class="bi bi-${a?"check-lg":"exclamation-triangle"}"></i>\n              </div>\n              <h2>${escapeHtml(s.message||"All Systems Operational")}</h2>\n              <p>Last updated: ${escapeHtml(s.updated_at||"Just now")}</p>\n            </div>\n\n            <div class="status-section">\n              <h3>About This Site</h3>\n              <p>Welcome to the PruneBit Status page. Here you can find real-time information about the operational status of all PruneBit services.</p>\n            </div>\n\n            <div class="status-card mb-4">\n              <div class="status-card-header">\n                <h4>Services</h4>\n              </div>\n              <div>\n                <div class="status-component">\n                  <span class="name"><span class="dot operational"></span>Create Wallet</span>\n                  <span class="status-value operational">Operational</span>\n                </div>\n                <div class="status-component">\n                  <span class="name"><span class="dot operational"></span>Import Wallet</span>\n                  <span class="status-value operational">Operational</span>\n                </div>\n                <div class="status-component">\n                  <span class="name"><span class="dot operational"></span>Transaction History</span>\n                  <span class="status-value operational">Operational</span>\n                </div>\n                <div class="status-component">\n                  <span class="name"><span class="dot operational"></span>Receive</span>\n                  <span class="status-value operational">Operational</span>\n                </div>\n                <div class="status-component">\n                  <span class="name"><span class="dot operational"></span>Send</span>\n                  <span class="status-value operational">Operational</span>\n                </div>\n                <div class="status-component">\n                  <span class="name"><span class="dot operational"></span>Wallet Security</span>\n                  <span class="status-value operational">Operational</span>\n                </div>\n                <div class="status-component">\n                  <span class="name"><span class="dot operational"></span>Access Wallet</span>\n                  <span class="status-value operational">Operational</span>\n                </div>\n                <div class="status-component">\n                  <span class="name"><span class="dot operational"></span>Address Check</span>\n                  <span class="status-value operational">Operational</span>\n                </div>\n                <div class="status-component">\n                  <span class="name"><span class="dot operational"></span>Check Prices</span>\n                  <span class="status-value operational">Operational</span>\n                </div>\n                <div class="status-component">\n                  <span class="name"><span class="dot operational"></span>Exchange Crypto</span>\n                  <span class="status-value operational">Operational</span>\n                </div>\n                <div class="status-component">\n                  <span class="name"><span class="dot operational"></span><a href="exchanges.html" style="color:inherit;text-decoration:none">Exchange</a></span>\n                  <span class="status-value operational">Operational</span>\n                </div>\n              </div>\n            </div>\n\n            <div class="status-section">\n              <h3>Active Incidents</h3>\n              ${s.incidents&&s.incidents.length>0?`\n                ${s.incidents.map(a=>`\n                  <div class="status-incident">\n                    <h5>${escapeHtml(a.title)}</h5>\n                    <p>${escapeHtml(a.description)}</p>\n                  </div>\n                `).join("")}\n              `:'\n                <div class="status-empty">\n                  <i class="bi bi-check-circle"></i>\n                  <p>No active incidents. All systems are running normally.</p>\n                </div>\n              '}\n            </div>\n\n            <div class="status-footer-text">\n              Need help? <a href="support.html">Contact support</a>\n            </div>\n          `}else n.innerHTML='\n            <div class="status-banner" style="background:var(--cv-danger-light);border:1px solid var(--cv-danger);color:var(--cv-danger);">\n              <div class="status-icon">\n                <i class="bi bi-exclamation-triangle"></i>\n              </div>\n              <h2>Unable to load status</h2>\n              <p>There was an error loading system status.</p>\n            </div>\n          '}catch(a){document.getElementById("statusContent").innerHTML=`\n          <div class="status-banner" style="background:var(--cv-danger-light);border:1px solid var(--cv-danger);color:var(--cv-danger);">\n            <div class="status-icon">\n              <i class="bi bi-exclamation-triangle"></i>\n            </div>\n            <h2>Status Unavailable</h2>\n            <p>${escapeHtml(a.message)}</p>\n          </div>\n        `}}loadStatus()</script><script src="../js/header.js?v=20260727a"></script>
